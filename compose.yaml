services:
  app:
    build: .
    environment:
      DATABASE_URL: postgres://scheduler:scheduler@postgres:5432/scheduler?sslmode=disable
      LOG_LEVEL: info
      SEED_FILE: /seed/appointments.json
    volumes:
      - ./appointments.json:/seed/appointments.json:ro
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: scheduler
      POSTGRES_DB: scheduler
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduler -d scheduler"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  pgdata:
