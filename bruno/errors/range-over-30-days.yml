info:
  name: Range over 30 days
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/trainers/{{trainerId}}/availability?starts_at={{slotStart}}&ends_at={{rangeEnd}}"
  params:
    - name: starts_at
      value: "{{slotStart}}"
      type: query
    - name: ends_at
      value: "{{rangeEnd}}"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 400", function () {
          expect(res.status).to.equal(400);
          expect(res.body.error).to.include("30 days");
        });

settings:
  encodeUrl: true
