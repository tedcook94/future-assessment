info:
  name: List appointments
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/trainers/{{trainerId}}/appointments"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("lists the booked appointment", function () {
          expect(res.status).to.equal(200);
          expect(res.body.appointments).to.have.lengthOf(1);

          const appt = res.body.appointments[0];
          expect(appt.id).to.equal(bru.getVar("appointmentId"));
          expect(appt.starts_at).to.equal(bru.getVar("slotStart"));
        });

settings:
  encodeUrl: true
