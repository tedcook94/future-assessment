info:
  name: Get availability
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/trainers/{{trainerId}}/availability?starts_at={{windowStart}}&ends_at={{windowEnd}}"
  params:
    - name: starts_at
      value: "{{windowStart}}"
      type: query
    - name: ends_at
      value: "{{windowEnd}}"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("excludes the booked slot", function () {
          expect(res.status).to.equal(200);

          const starts = res.body.available_times.map((s) => s.starts_at);
          expect(starts).to.have.lengthOf(2);
          expect(starts).to.not.include(bru.getVar("slotStart"));
          expect(starts).to.include(bru.getVar("windowStart"));
        });

settings:
  encodeUrl: true
